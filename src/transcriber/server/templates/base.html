<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Transcriber{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M8 12h16M8 17h16M8 22h10' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <script>try { var r = document.documentElement, t = localStorage.getItem("transcriber.theme"); if (t === "light" || t === "dark") r.dataset.theme = t; if (localStorage.getItem("transcriber.sidebar") === "hidden") r.dataset.sidebar = "hidden"; } catch (e) {}</script>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/vendor/htmx.min.js"></script>
  <script src="/static/app.js"></script>
  <script defer src="/static/vendor/alpine.min.js"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></symbol>
  <symbol id="i-audio" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></symbol>
  <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="5" width="13" height="14" rx="2"/><path d="m16 10 5-3v10l-5-3"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 8v5M12 16.5v.01"/><path d="M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M4 20h16"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" stroke-width="3.2"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
  <symbol id="i-lines" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></symbol>
  <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="m16 9.5 5 5M21 9.5l-5 5"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
  <symbol id="i-theater" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="10" rx="2"/><path d="M7 19h10"/></symbol>
  <symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9.5 4v16"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
  <symbol id="i-auto" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></symbol>
</svg>

<div class="app">
  <button class="side-open" x-data x-on:click="$store.sidebar.toggle()" aria-label="Show sidebar" title="Show sidebar"><svg class="i"><use href="#i-sidebar"/></svg></button>
  <aside class="side">
    <div class="side-top" x-data>
      <a class="brand" href="/"><span class="logo"><svg class="i"><use href="#i-lines"/></svg></span>Transcriber</a>
      <div class="side-tools">
        <button class="icon-btn" x-on:click="$store.theme.cycle()" x-bind:aria-label="'Theme: ' + $store.theme.mode + '. Click to change.'" x-bind:title="'Theme: ' + $store.theme.mode + ' (click to change)'">
          <svg class="i" x-show="$store.theme.mode === 'Auto'"><use href="#i-auto"/></svg>
          <svg class="i" x-show="$store.theme.mode === 'Light'" x-cloak><use href="#i-sun"/></svg>
          <svg class="i" x-show="$store.theme.mode === 'Dark'" x-cloak><use href="#i-moon"/></svg>
        </button>
        <button class="icon-btn hide-btn" x-on:click="$store.sidebar.toggle()" aria-label="Hide sidebar" title="Hide sidebar"><svg class="i"><use href="#i-sidebar"/></svg></button>
      </div>
    </div>
    <nav aria-label="Projects">
      <div class="label">Projects</div>
      <a class="nav-item{{ ' on' if nav_page == 'projects' }}" href="/"><svg class="i"><use href="#i-folder"/></svg><span class="t">All projects</span><span class="count">{{ nav_projects | length }}</span></a>
      {% for p in nav_projects %}
      <a class="nav-item{{ ' on' if p.id == nav_active and not nav_sub }}{{ ' parent' if p.id == nav_active and nav_sub }}" href="/projects/{{ p.id }}" title="{{ p.name }}"><svg class="i"><use href="#i-folder"/></svg><span class="t">{{ p.name }}</span></a>
      {% if p.id == nav_active and nav_sub %}
      <a class="nav-item sub{{ ' on' if nav_sub == 'recordings' }}" href="/projects/{{ p.id }}"><svg class="i"><use href="#i-audio"/></svg><span class="t">Recordings</span><span class="count">{{ p.n_files }}</span></a>
      <a class="nav-item sub{{ ' on' if nav_sub == 'transcripts' }}" href="/projects/{{ p.id }}/transcripts"><svg class="i"><use href="#i-doc"/></svg><span class="t">Transcripts</span><span class="count">{{ p.n_done }}</span></a>
      {% endif %}
      {% endfor %}
    </nav>
    <nav aria-label="App">
      <div class="label">App</div>
      <a class="nav-item{{ ' on' if nav_page == 'setup' }}" href="/setup"><svg class="i"><use href="#i-gear"/></svg><span class="t">Setup</span></a>
    </nav>
  </aside>
  <main class="main{% block mainclass %}{% endblock %}">
    <div class="wrap{% block wrapclass %}{% endblock %}">{% block content %}{% endblock %}</div>
  </main>
</div>
</body>
</html>
